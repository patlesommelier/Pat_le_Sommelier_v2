# Netlify détecte Next.js et installe automatiquement son runtime.
[build]
  # Migrations de la base (Supabase) avant le build de production : voir scripts/migrer.ts.
  command = "npm run migrer && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Fonctions d'arrière-plan : sharp (lecture des photos de la carte et du menu) est un module natif,
  # livré tel quel plutôt que regroupé.
  external_node_modules = ["sharp"]
